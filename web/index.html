<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>C 练习 - 训练页面</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
</head>
<body>
  <header>
    <h1>C 练习</h1>
    <p>用于练习 C 语言的简易网页。可在线编辑、下载并在本地运行。</p>
  </header>

  <main>
    <aside id="ex-list">
      <h2>练习</h2>
      <ul id="exercises"></ul>
    </aside>

    <section id="editor-area">
      <div id="meta">
        <h2 id="title">请选择练习</h2>
        <div id="controls">
          <button id="download">下载 .c</button>
          <button id="copy">复制</button>
        </div>
      </div>

      <textarea id="code" spellcheck="false"></textarea>

      <div id="info">
        <h3>题目描述</h3>
        <pre id="desc">从左侧选择一个练习。</pre>

        <h3>示例输入</h3>
        <pre id="sample-in">-</pre>

        <h3>示例输出</h3>
        <pre id="sample-out">-</pre>

        <h3>运行方式</h3>
        <pre>
在本地编译：
gcc yourfile.c -o yourfile
./yourfile
        </pre>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
  <script src="script.js"></script>
</body>
</html>

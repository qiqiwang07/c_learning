<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>C 练习工坊</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
</head>

<body>
  <div class="page-noise"></div>
  <div class="page-glow page-glow-left"></div>
  <div class="page-glow page-glow-right"></div>
  <div class="page-shell">
    <!-- 主页面顶部介绍已移除，直接进入课程网格 -->

    <div id="user-bar" class="soft-panel user-bar"></div>

    <div id="auth-modal" class="modal hidden">
      <div class="modal-content">
        <p class="eyebrow">Account Access</p>
        <h2 id="auth-title">登录</h2>
        <p class="auth-copy">登录后可保存代码片段，并在当前浏览器中保持会话。</p>

        <label class="field-label" for="auth-username">用户名</label>
        <input id="auth-username" placeholder="例如：student01" />

        <label class="field-label" for="auth-password">密码</label>
        <input id="auth-password" type="password" placeholder="至少 6 位" />

        <div id="auth-error" class="error"></div>

        <button id="auth-submit" data-mode="login">登录</button>

        <p class="auth-switch-row">
          <span id="auth-switch-text">没有账号？</span>
          <a id="auth-switch" href="#">去注册</a>
        </p>
      </div>
    </div>

    <div id="app" class="hidden">
      <main class="course-market-shell">
          <!-- 直接展示课程网格（移除标题与介绍） -->
        <div id="course-grid" class="course-grid">
          <!-- Courses Grid Cards dynamically generated here -->
        </div>
      </main>
    </div>

    <div id="course-reader-modal" class="modal hidden">
      <div id="course-reader-panel" class="course-reader-panel">
        <div class="course-reader-head">
          <h3 id="course-reader-title">课程阅读</h3>
          <div class="course-reader-actions">
            <button id="course-reader-close" class="course-reader-btn course-reader-btn-close" type="button">退出</button>
          </div>
        </div>
        <div id="course-reader-meta" class="course-reader-meta"></div>
        <div id="course-reader-body" class="course-reader-body"></div>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

<script type="module" src="./main.js"></script>

</body>
</html>

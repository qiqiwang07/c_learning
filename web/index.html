<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>C 练习 - 训练页面</title>

  <link rel="stylesheet" href="style.css">

  <!-- CodeMirror -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css"
  >
</head>

<body>

<header>
  <h1>💻 C 练习</h1>
  <p>在线练习 C 语言，可编辑代码、运行并结合 AI 学习。</p>
</header>

<main>

  <!-- 左侧：练习列表 -->
  <aside id="ex-list">
    <h2>📚 练习列表</h2>
    <ul id="exercises"></ul>
  </aside>

  <!-- 中间：代码主区域 -->
  <section id="editor-main">

    <!-- 顶部工具栏 -->
    <div id="meta">
      <h2 id="title">请选择练习</h2>

      <div id="controls">
        <button id="check">检查</button>
        <button id="run-code">运行</button>
        <button id="save">保存</button>
      </div>
    </div>

    <!-- 代码编辑器 -->
    <div id="code-wrap">
      <textarea id="code" spellcheck="false">#include <stdio.h>

int main() {
    printf("Hello, C!\n");
    return 0;
}
</textarea>
    </div>

    <!-- 控制台 -->
    <div id="console-wrap">
      <h3>🖥 控制台</h3>
      <div id="console-output" class="panel"></div>
    </div>

  </section>

  <!-- 右侧：题目 + AI -->
  <aside id="right-panel">

    <section class="right-section">
      <h3>📖 题目描述</h3>
      <pre id="desc">从左侧选择一个练习。</pre>
    </section>

    <section class="right-section">
      <h3>📥 示例输入</h3>
      <pre id="sample-in">-</pre>
    </section>

    <section class="right-section">
      <h3>📤 示例输出</h3>
      <pre id="sample-out">-</pre>
    </section>

    <section id="ai-panel">
      <h3>🤖 AI 助手</h3>

      <div id="ai-output" class="panel"></div>

      <textarea
        id="ai-input"
        placeholder="问 AI，比如：这段代码哪里错了？"
      ></textarea>

      <button id="ai-send">发送</button>
    </section>

  </aside>

</main>

<!-- CodeMirror -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

<!-- 主逻辑 -->
./main.jsscript>

</body>
</html>

  <!doctype html>
  <html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>C 练习 - 训练页面</title>

    <!-- 主样式 -->
    <link rel="stylesheet" href="style.css">

    <!-- CodeMirror -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

    <!-- 主题（更好看） -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
  </head>

  <body>

    <!-- 头部 -->
    <header>
      <h1>💻 C 练习</h1>
      <p>在线练习 C 语言，可编辑代码、下载并在本地运行。</p>
    </header>

    <!-- 主体 -->
    <main>

      <!-- 左侧练习列表 -->
      <aside id="ex-list">
        <h2>📚 练习列表</h2>
        <ul id="exercises" class="list"></ul>
      </aside>

      <!-- 右侧编辑区 -->
      <section id="editor-area">

        <!-- 顶部标题和按钮 -->
        <div id="meta">
          <h2 id="title">请选择练习</h2>

          <div id="controls">
            <button id="download" title="下载为 .c 文件">
              ⬇ 下载
            </button>

            <button id="copy" title="复制代码">
              📋 复制
            </button>
          </div>
        </div>

        <!-- 编辑器 -->
        <textarea id="code" spellcheck="false">
  #include <stdio.h>

  int main() {
      printf("Hello, C!\n");
      return 0;
  }
        </textarea>

        <!-- 题目信息 -->
        <div id="info">

          <h3>📖 题目描述</h3>
          <pre id="desc">从左侧选择一个练习。</pre>

          <h3>📥 示例输入</h3>
          <pre id="sample-in">-</pre>

          <h3>📤 示例输出</h3>
          <pre id="sample-out">-</pre>

          <h3>⚙ 运行方式</h3>
          <pre>
  在本地编译：

  gcc yourfile.c -o yourfile
  ./yourfile
          </pre>

        </div>
      </section>

    </main>

    <!-- CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

    <!-- 你的逻辑 -->
    <script src="script.js" charset="utf-8"></script>

  </body>
  </html>
